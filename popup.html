<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #1c1e21;
      width: 260px;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      background: #1877f2;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 14px;
      font-weight: 700;
    }

    .header-sub {
      font-size: 11px;
      color: #65676b;
    }

    .status-row {
      background: #f0f2f5;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #65676b;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .status-row.active {
      background: #e6f4ea;
      color: #1e7e34;
    }

    .status-row.no-key {
      background: #fdecea;
      color: #c0392b;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
      margin-bottom: 8px;
    }

    .btn-settings {
      background: #e4e6eb;
      color: #1c1e21;
    }

    .btn-settings:hover {
      background: #d8dadf;
    }

    .hint {
      font-size: 11px;
      color: #65676b;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">&#9776;</div>
    <div>
      <div class="header-title">FB Group Listings</div>
      <div class="header-sub">AI-powered listing extractor</div>
    </div>
  </div>

  <div class="status-row" id="status-row">Checking status…</div>

  <button class="btn btn-settings" id="settings-btn">&#9881; Open Settings</button>

  <p class="hint" id="hint-text">Navigate to a Facebook group and use the sidebar to generate listings.</p>

  <script src="popup.js"></script>
</body>
</html>
