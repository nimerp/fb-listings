<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #1c1e21;
      background: #fff;
    }

    #fbl-sidebar {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-left: 1px solid #dddfe2;
      border-bottom: 1px solid #dddfe2;
      border-radius: 0 0 0 8px;
      overflow: hidden;
    }

    /* Header */
    #fbl-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #1877f2;
      color: #fff;
      flex-shrink: 0;
      user-select: none;
    }
    #fbl-logo { font-weight: 700; font-size: 14px; letter-spacing: 0.3px; white-space: nowrap; }
    #fbl-header-actions { display: flex; gap: 6px; flex-shrink: 0; }
    #fbl-header-actions button {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #fbl-header-actions button:hover { background: rgba(255,255,255,0.35); }

    /* Body */
    #fbl-body { display: flex; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }

    /* Action buttons */
    #fbl-actions { padding: 10px 12px 6px; display: flex; gap: 8px; flex-shrink: 0; }
    .fbl-primary-btn, .fbl-secondary-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .fbl-primary-btn { background: #1877f2; color: #fff; }
    .fbl-primary-btn:hover:not(:disabled) { background: #166fe5; }
    .fbl-secondary-btn { background: #e4e6eb; color: #1c1e21; }
    .fbl-secondary-btn:hover:not(:disabled) { background: #d8dadf; }
    .fbl-primary-btn:disabled, .fbl-secondary-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Search */
    #fbl-search {
      margin: 4px 12px 6px;
      padding: 7px 10px;
      border: 1px solid #dddfe2;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
      background: #f0f2f5;
      color: #1c1e21;
      flex-shrink: 0;
    }
    #fbl-search:focus { border-color: #1877f2; background: #fff; }

    /* Tabs */
    #fbl-tabs {
      display: flex;
      border-bottom: 2px solid #e4e6eb;
      flex-shrink: 0;
      padding: 0 12px;
      gap: 4px;
    }
    .fbl-tab {
      flex: 1;
      padding: 8px 4px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #65676b;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .fbl-tab:hover { color: #1877f2; }
    .fbl-tab.active { color: #1877f2; border-bottom-color: #1877f2; }
    .fbl-count {
      background: #e4e6eb;
      color: #1c1e21;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 700;
    }
    .fbl-tab.active .fbl-count { background: #e7f0fd; color: #1877f2; }

    /* Status */
    #fbl-status {
      margin: 6px 12px 2px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
      flex-shrink: 0;
      line-height: 1.4;
    }
    #fbl-status.info    { background: #e7f0fd; color: #1877f2; display: block; }
    #fbl-status.success { background: #e6f4ea; color: #1e7e34; display: block; }
    #fbl-status.warn    { background: #fff3cd; color: #856404; display: block; }
    #fbl-status.error   { background: #fdecea; color: #c0392b; display: block; }

    /* Listings */
    #fbl-listings-container {
      flex: 1;
      overflow-y: auto;
      padding: 6px 12px 12px;
      min-height: 0;
    }
    #fbl-listings-container::-webkit-scrollbar { width: 5px; }
    #fbl-listings-container::-webkit-scrollbar-thumb { background: #bec3c9; border-radius: 3px; }

    .fbl-empty-state {
      text-align: center;
      color: #65676b;
      padding: 32px 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    .fbl-card {
      background: #f0f2f5;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #e4e6eb;
    }
    .fbl-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .fbl-listing-type {
      display: inline-block;
      background: #e7f0fd;
      color: #1877f2;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 4px;
      margin-bottom: 5px;
    }
    .fbl-card-title { font-weight: 700; font-size: 14px; color: #1c1e21; margin-bottom: 7px; line-height: 1.3; }
    .fbl-fields { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .fbl-field {
      background: #fff;
      border: 1px solid #dddfe2;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      color: #65676b;
    }
    .fbl-field-key { font-weight: 600; color: #444950; }
    .fbl-card-desc { font-size: 12px; color: #444950; line-height: 1.45; margin-bottom: 8px; }
    .fbl-card-link { font-size: 12px; color: #1877f2; text-decoration: none; font-weight: 600; }
    .fbl-card-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="fbl-sidebar">
    <div id="fbl-header">
      <span id="fbl-logo">&#9776; Listings</span>
      <div id="fbl-header-actions">
        <button id="fbl-settings-btn" title="Settings">&#9881;</button>
        <button id="fbl-toggle-btn" title="Collapse">&#8249;</button>
      </div>
    </div>

    <div id="fbl-body">
      <div id="fbl-actions">
        <button id="fbl-generate-btn" class="fbl-primary-btn">&#9889; Generate Listings</button>
        <button id="fbl-refresh-btn" class="fbl-secondary-btn" style="display:none">&#8635; Refresh</button>
      </div>

      <input id="fbl-search" type="text" placeholder="Search listings..." />

      <div id="fbl-tabs">
        <button class="fbl-tab active" data-tab="offers">
          Offers <span class="fbl-count" id="fbl-offers-count">0</span>
        </button>
        <button class="fbl-tab" data-tab="requests">
          Requests <span class="fbl-count" id="fbl-requests-count">0</span>
        </button>
      </div>

      <div id="fbl-status"></div>

      <div id="fbl-listings-container">
        <div id="fbl-offers-panel">
          <div class="fbl-empty-state">Click "Generate Listings" to get started.</div>
        </div>
        <div id="fbl-requests-panel" style="display:none">
          <div class="fbl-empty-state">Click "Generate Listings" to get started.</div>
        </div>
      </div>
    </div>
  </div>
  <script src="sidebar.js"></script>
</body>
</html>
